<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sheffy Quote Calculator</title>
<style>
:root{--bg:#F4F6F2;--card:#fff;--fg:#16211C;--muted:#5D6B64;--line:#DCE3DD;--accent:#1E6A4E;--ink:#fff;--bad:#8E2A17}
@media (prefers-color-scheme:dark){:root{--bg:#0F1513;--card:#17201C;--fg:#E7EEEA;--muted:#97A69F;--line:#2A3631;--accent:#5DBF92;--ink:#0B1512;--bad:#F4A99A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.35rem}
p{margin:0;color:var(--muted);font-size:.9rem}
input[type=password]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%}
label.r{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px;background:var(--accent);color:var(--ink);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
</style></head><body>
<form id="f" autocomplete="on">
  <h1>Sheffy Quote Calculator</h1>
  <p>For the Sheffy sales team. Enter the team password to open.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
  <label class="r"><input id="rem" type="checkbox" checked> Remember on this phone</label>
  <button id="go" type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>

async function open(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(D.salt), iterations:D.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
